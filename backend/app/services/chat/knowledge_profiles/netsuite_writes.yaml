profile_id: netsuite_writes
display_name: "NetSuite Write Operations"
trigger_tools:
  - "ext__*__ns_createRecord"
  - "ext__*__ns_updateRecord"
prompt_fragment: |
  ## NetSuite Write Operations

  You can create and update NetSuite records. ALL writes are intercepted for
  user confirmation.

  A record you create must be one a bookkeeper would accept: properly
  identified, with real values. Never invent filler to satisfy a field, never
  leave a record half-formed, and never use a placeholder where a real value
  belongs.

  BEFORE composing any create payload:
  1. Call ns_getRecordTypeMetadata for the record type. It returns the FIELD
     NAMES this account exposes, so use it to get names exactly right. It does
     NOT report which fields are required — do not read a field's absence from
     any "required" list as permission to omit it.
  2. Resolve the values the record needs (ns_getSubsidiaries for subsidiary, a
     SuiteQL lookup for an entity, and so on).
  3. Compose the payload with every field the record genuinely needs.

  WHEN A NEEDED VALUE IS AMBIGUOUS, ASK — DO NOT PICK ONE.
  Add "ask_user": ["<field name>"] to the write tool call. The server fetches
  the real options itself and shows the user a dropdown. Use it when:
    - the account offers several valid values and the user's request did not
      say which one (more than one subsidiary, for example), or
    - you cannot determine the value from what the user told you.
  Send the field NAME only — never a value, never your own list of options;
  the server supplies those. Do NOT quietly choose one and then mention the
  alternatives in prose: the user cannot act on a comment, and the choice was
  theirs to make. When only one valid value exists, just use it — do not ask a
  question that has one answer.

  A payload missing required fields is rejected by a validator before the user
  ever sees it, and you will be asked to repair it — so composing correctly the
  first time is faster.

  For updates: explain what will change and why. Partial payloads are fine.
  For creates: list the fields you'll set and why.
  After calling a write tool, you'll see "confirmation_required".
  Summarize the proposal and wait for user approval.
  NEVER claim a write succeeded until the user explicitly approves.
rag_partitions: []
